[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dietrich"
version = "0.1.0"
description = "Validador de cobertura lógica avanzada MC/DC (Modified Condition/Decision Coverage) en C"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Martín René Vilugrón", email = "martinvilu@gmail.com"}
]
maintainers = [
    {name = "Programación I [B6003] - UNRN Andina"}
]
requires-python = ">=3.11"
keywords = ["education", "c-programming", "pedagogical-tools", "unrn"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-c>=0.23.0",
]

[project.urls]
Homepage = "https://github.com/INGCOM-UNRN-P1/dietrich"
Repository = "https://github.com/INGCOM-UNRN-P1/dietrich.git"
Issues = "https://github.com/INGCOM-UNRN-P1/dietrich/issues"

[project.scripts]
dietrich = "dietrich.cli:app"

[project.entry-points."ripley.plugins"]
mcdc_coverage = "dietrich.plugins.ripley_plugin:DietrichPlugin"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]